      margin: 4px 0;

      border-collapse: collapse;

      background: none;

      padding: 0 6px 0 0;

      <div>2体目: <input id="p2-name" type="text" placeholder="モンスター名" style="width:120px;padding:4px;font-size:13px;"> ★<input id="p2-star" type="number" min="1" max="4" value="2" style="width:40px;padding:4px;font-size:13px;"> Lv<input id="p2-lv" type="number" min="1" max="10" value="5" style="width:45px;padding:4px;font-size:13px;"></div>
      <div>3体目: <input id="p3-name" type="text" placeholder="モンスター名" style="width:120px;padding:4px;font-size:13px;"> ★<input id="p3-star" type="number" min="1" max="4" value="2" style="width:40px;padding:4px;font-size:13px;"> Lv<input id="p3-lv" type="number" min="1" max="10" value="5" style="width:45px;padding:4px;font-size:13px;"></div>
    </div>
    <div style="margin-top:8px; display:flex; flex-wrap:wrap; align-items:center; gap:10px;">
      <button type="button" onclick="applyParty()" style="background:#0284c7; color:white; border:none; padding:6px 12px; font-size:14px; cursor:pointer;">このチームで出現率を計算</button>
      <span id="party-info" style="font-size:13px; color:#cbd5e1;">クラス合計: 6 / 合計Lv: 15</span>
    </div>
  </div>

  <div>
    <label>章で絞り込み：</label>
    <select id="chapter">
      <option value="ALL">すべて</option>
      <option value="序章">序章</option>
      <option value="第1章">第1章</option>
      <option value="第2章">第2章</option>
      <option value="第3章">第3章</option>
      <option value="第4章">第4章</option>
      <option value="第5章">第5章</option>
      <option value="第6章">第6章</option>
      <option value="第7章">第7章</option>
      <option value="外伝・コラボ">外伝・コラボ</option>
    </select>

    <input
      id="search"
      type="text"
      placeholder="名前で検索..."
    />

    <select id="methodFilter">
      <option value="ALL">入手：すべて</option>
      <option value="バトル">バトル入手のみ</option>
      <option value="合体">合体入手のみ</option>
      <option value="両方">両方できるのみ</option>
    </select>

    <label style="font-size: 14px;">合体1プレイ抽選回数：</label>
    <input
      id="fusionRolls"
      type="number"
      min="1"
      max="30"
      value="5"
      style="width: 60px; padding: 6px;"
    />

    <label style="display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; font-size: 15px; cursor: pointer;">
      <input id="markedOnly" type="checkbox" style="width: 18px; height: 18px; margin: 0;" />
      <span>★マークのみ表示</span>
    </label>
  </div>

      const ENCOUNTER_RATES = {"トロル": 75, "ジバクガエル": 25, "赤のプリンセス": 25, "ガルル": 62, "プチクラブ": 45, "スライム": 91, "スライム・ドラゴン": 53, "スライム・シルバー": 62, "スライム・ゴールド": 42, "スライム・マナ": 53, "プチドラゴン": 25, "戦士スタン": 25, "魔法使いマナナ": 25, "ボット02": 25, "ゼノゴン": 50, "炎の召喚士ヒート": 16, "呪師テングリ": 30, "魔獣クイックシルバー": 71, "魔姫カーリィ": 25, "魔王バスカー": 100, "ベヒ": 25, "ランスロット": 25, "ツインビー": 25, "魔王ムウス": 25, "ジャリゲータ": 66, "ギン": 66, "クリオネ": 94, "チビドラゴン": 79, "コッパミジンコ": 88, "スライム・アビス": 46, "スライム・フレア": 49, "波戦士トリト": 46, "拳士シャッパ": 46, "スフィ": 64, "ギョ": 46, "アケロン": 27, "海賊アンカー": 18, "魔王オロロソ": 100, "泡魔法使いポワン": 27, "バクチガエル": 89, "キュピィ": 97, "クロドラゴン": 97, "ひな鳥ルフ": 100, "スライム・アース": 71, "スライム・エアロ": 49, "旅人アラン": 27, "旅人シャール": 27, "ステゴ": 43, "イブリス": 43, "ドラコ": 43, "アヌビス": 66, "魔王アラキシュ": 100, "鍛冶師アンヴィル": 49, "機臣ブレイク": 27, "ドラコッコ": 97, "森の子クルミ": 89, "バク": 97, "風のナギ": 43, "公子イスル": 43, "ミズチ": 43, "シナプ": 43, "オグナ": 88, "魔王ソジュ": 100, "剣客ヒエン": 43, "風隠の主ナナワライ": 100, "マンダー": 97, "ブブ": 92, "悪魔マクス": 71, "衛生兵ラプラ": 53, "アルフ": 30, "エスティ": 30, "アスタ": 30, "魔女ロジェステ": 58, "魔皇エラドーラ": 100, "イルベン": 30, "フロス": 82, "コタコン": 98, "モアイ": 38, "トゥルース": 38, "歌士ヴェッチ": 46, "奏士チューン": 58, "ボット02 拍子型": 46, "トール": 55, "魔皇ミード": 100, "リフゴン": 33, "ミカエ": 40, "ヘイムダル": 40, "アルラ": 62, "パール": 91, "グリ": 84, "墓守エルメ": 49, "死神見習いタナト": 45, "聖堂騎士ユーグ": 35, "獄卒ゴズ": 100, "獄卒メズ": 100, "アテナ": 67, "魔皇アウスレーゼ": 100, "ボーン": 45, "ダイヤ": 25, "デュラ": 19, "クリスタルドラゴン": 100, "トレーニー・アリア": 100, "破壊神マハデーヴァ": 100, "スライム・トリフ": 100, "魔王リヴィエール": 100, "トレーニー・シャッパ": 100, "オーディン": 100, "魔王レオナーレ": 100, "獄王閻魔": 100, "大魔王バスカー": 100, "大魔王ムウス": 100, "大魔王オロロソ": 100, "大魔王アラキシュ": 100, "大魔王ソジュ": 100, "龍王ライシーヤ": 100, "商人アリ": 100, "フリーレン": 100};

            "UPDATE monsters SET method = ?, hp = ?, at = ?, sp = ?, cmd = ?, marked = ? WHERE id = ?",

    function saveAll() {
      try {
        const res = db.exec("SELECT id, method, hp, at, sp, cmd, marked FROM monsters");
        const data = res.length > 0 ? res[0].values : [];
        localStorage.setItem("oreca2_sql_saved_v2", JSON.stringify(data));
      } catch (_) {}
    }

    function render() {
      const chap = document.getElementById("chapter").value;
      const methodFilter = document.getElementById("methodFilter").value;
      const keyword = document.getElementById("search").value.trim();
      const fusionRolls = Math.max(1, Number(document.getElementById("fusionRolls").value) || 1);
      const markedOnly = document.getElementById("markedOnly").checked;

      const conditions = [];
      const whereParams = [];

      if (chap !== "ALL") {
        conditions.push("chapter = ?");
        whereParams.push(chap);
      }
      if (methodFilter === "バトル") {
        conditions.push("can_battle = 1");
      } else if (methodFilter === "合体") {
        conditions.push("can_fusion = 1");
      } else if (methodFilter === "両方") {
        conditions.push("can_battle = 1 AND can_fusion = 1");
      }
      
      if (keyword !== "") {
        conditions.push("name LIKE ?");
        whereParams.push(`%${keyword}%`);
      }
      if (markedOnly) {
        conditions.push("marked = 1");
      }

      const whereSql = conditions.length > 0 ? "WHERE " + conditions.join(" AND ") : "";

      // ③ SQLで確率と期待金額を計算
      const sql = `
          SELECT
          id, name, chapter, method, can_battle, can_fusion, hp, at, sp, cmd, marked, encounter_pct,
          ROUND((hp / 6.0) * (at / 6.0) * (sp / 6.0) * (cmd / 6.0) * 100, 4) AS pct,
          ROUND(
            1.0 / (
              (hp / 6.0) * (at / 6.0) * (sp / 6.0) * (cmd / 6.0)
              * CASE WHEN method = 'バトル' THEN (encounter_pct / 100.0) ELSE 1.0 END
            )
            / CASE WHEN method = '合体' THEN ? ELSE 1 END
            * 100 + 100
          ) AS cost
        FROM monsters
        ${whereSql}
        ORDER BY id ASC;
      `;

      const res = db.exec(sql, [fusionRolls, ...whereParams]);
      if (res.length === 0) {
        document.getElementById("summary").textContent = "合計期待金額：0円（0体）";
        document.getElementById("output").innerHTML = "該当なし";
        return;
      }

      const makeSelect = (id, label, col, current, isCmd = false) => {
        const opts = isCmd
          ? [[1, "コマ潜"], [6, "不問"]]
          : [[1, "A"], [2, "B+"], [3, "C+"], [4, "D+"], [5, "E+"], [6, "不問"]];
        return `
          <label style="display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: #94a3b8;">
            <span>${label}</span>
            <select onchange="updateStat(${id}, '${col}', this.value)" style="padding: 2px 4px; font-size: 12px;">
              ${opts.map(([v, text]) => `<option value="${v}" ${v === current ? "selected" : ""}>${text}</option>`).join("")}
            </select>
          </label>
        `;
      };

      let total = 0;
      const count = res[0].values.length;
      let html = `
        <table>
          <tr>
            <th>モンスター名</th>
            <th>条件</th>
            <th>確率</th>
            <th>期待金額</th>
          </tr>
      `;

      const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
      res[0].values.forEach(([id, name, chap, method, canBattle, canFusion, hp, at, sp, cmd, marked, encPct, pct, cost]) => {
        const num = hp * at * sp * cmd;
        const den = 1296;
        const g = gcd(num, den);
        const frac = `${num / g}/${den / g}`;
        const badgeColor = method === "合体" ? "#34d399" : "#60a5fa";
        const star = marked ? "★" : "☆";
        const starColor = marked ? "#fbbf24" : "#64748b";
        total += Number(cost);
        const methodHtml = (canBattle && canFusion)
          ? `<select onchange="updateMethod(${id}, this.value)" style="padding: 1px 4px; font-size: 11px; margin: 0;">
               <option value="バトル" ${method === "バトル" ? "selected" : ""}>バトル</option>
               <option value="合体" ${method === "合体" ? "selected" : ""}>合体</option>
             </select> <small style="color:#fbbf24;">(両方可)</small>`
          : `<span style="color: ${badgeColor};">${method}</span>`;

        html += `
          <tr>
            <td>
              <button class="star-btn" style="color: ${starColor};" onclick="toggleMark(${id}, ${marked})">${star}</button>${name}<br>
              <small style="color: #94a3b8;">
                ${chap} / ${methodHtml}
              </small>
            </td>
            <td>
              <div style="display: grid; grid-template-columns: repeat(2, max-content); gap: 4px 8px;">
                ${makeSelect(id, "HP", "hp", hp)}
                ${makeSelect(id, "攻", "at", at)}
                ${makeSelect(id, "速", "sp", sp)}
                ${makeSelect(id, "コ", "cmd", cmd, true)}
              </div>
            </td>
            <td>
              ${frac}<br>
              <small style="color: #94a3b8;">${pct}%</small>
            </td>
            <td>
              ${Number(cost).toLocaleString()}円
              ${method === "バトル" ? `<br><small style="color:#94a3b8;">出現率 ${encPct}%</small>` : ""}
            </td>
          </tr>
        `;
      });

      html += "</table>";

      document.getElementById("summary").textContent = `合計期待金額：${total.toLocaleString()}円（${count}体）`;
      document.getElementById("output").innerHTML = html;
    }

    function updateStat(id, col, val) {
      const allowed = ["hp", "at", "sp", "cmd"];
      if (!allowed.includes(col)) return;
      db.run(`UPDATE monsters SET ${col} = ? WHERE id = ?`, [Number(val), Number(id)]);
      saveAll();
      render();
    }
    function updateMethod(id, method) {
      if (method !== "バトル" && method !== "合体") return;
      db.run("UPDATE monsters SET method = ? WHERE id = ?", [method, Number(id)]);
      saveAll();
      render();
    }

    function toggleMark(id, current) {
      const next = current ? 0 : 1;
      db.run("UPDATE monsters SET marked = ? WHERE id = ?", [next, Number(id)]);
      saveAll();
      render();
    }

    document.getElementById("chapter").addEventListener("change", render);
    document.getElementById("search").addEventListener("input", render);
    document.getElementById("methodFilter").addEventListener("change", render);
    document.getElementById("fusionRolls").addEventListener("input", render);
    document.getElementById("markedOnly").addEventListener("change", render);
    function comb(n, r) {
      if (r < 0 || r > n) return 0;
      let res = 1;
      for (let i = 1; i <= r; i++) res = res * (n - i + 1) / i;
      return res;
    }

    function applyParty() {
      const names = [1, 2, 3].map(i => document.getElementById(`p${i}-name`).value.trim());
      const stars = [1, 2, 3].map(i => Number(document.getElementById(`p${i}-star`).value) || 0);
      const lvs = [1, 2, 3].map(i => Number(document.getElementById(`p${i}-lv`).value) || 0);
      const totalStar = stars.reduce((a, b) => a + b, 0);
      const totalLv = lvs.reduce((a, b) => a + b, 0);

      const mainBracket = totalStar <= 6 ? "3-6" : totalStar <= 9 ? "7-9" : "10-12";
      const brackets = [mainBracket];
      if (totalLv <= 10 && mainBracket === "7-9") brackets.push("3-6");
      if (totalLv <= 10 && mainBracket === "10-12") brackets.push("7-9");
      if (totalLv >= 21 && mainBracket === "3-6") brackets.push("7-9");
      if (totalLv >= 21 && mainBracket === "7-9") brackets.push("10-12");

      const ph = brackets.map(() => "?").join(",");
      const totalRes = db.exec(`SELECT COUNT(*) FROM enemy_teams WHERE chapter = '序章' AND bracket IN (${ph})`, brackets);
      const T = totalRes[0].values[0][0];

      const mRes = db.exec("SELECT id, name FROM monsters WHERE chapter = '序章' AND can_battle = 1");
      mRes[0].values.forEach(([id, name]) => {
        const kRes = db.exec(
          `SELECT COUNT(*) FROM enemy_teams WHERE chapter = '序章' AND bracket IN (${ph}) AND (m1 = ? OR m2 = ? OR m3 = ?)`,
          [...brackets, name, name, name]
        );
        const K = kRes[0].values[0][0];
        let pct = K === 0 ? 5 : (T - K < 3 ? 100 : Math.round((1 - comb(T - K, 3) / comb(T, 3)) * 100));

        if (name === "魔王バスカー" && (names[0] === "赤騎士スタン" || (names.includes("赤騎士スタン") && names.includes("魔導師マナナール") && names.includes("ボット03")))) pct = 100;
        if (name === "邪神バスカー" && (names[0] === "紅蓮の騎士スタン" || names[0] === "魔王ムウス")) pct = 100;
        if (name === "魔王ムウス" && K === 0) pct = 25;
        if (name === "魔姫カーリィ" && mainBracket === "10-12") pct = 25;
        if (name === "ゼノゴン" && mainBracket === "3-6") pct = 50;

        db.run("UPDATE monsters SET encounter_pct = ? WHERE id = ?", [Math.max(1, pct), id]);
      });

      document.getElementById("party-info").textContent =
        `クラス合計: ${totalStar} (${mainBracket}) / 合計Lv: ${totalLv} / 対象帯: ${brackets.join("・")}`;
      render();
    }
    init();
  </script>
