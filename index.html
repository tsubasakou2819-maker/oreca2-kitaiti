    function getStatText(name, method, hpVal, atVal, spVal) {
      const st = MONSTER_STATS[name];
      if (!st) return "";
      const fmt = (arr, v) => {
        const minV = arr[6 - v];
        const maxV = arr[5];
        return minV === maxV ? `${maxV}` : `${minV}〜${maxV}`;
      };
      const lvs = method === "合体" ? [1] : (st.hp[3] ? [1, 2, 3] : [1, 2]);
      const lvHtml = lvs
        .filter(lv => st.hp[lv])
        .map(lv => `<div style="font-size:11px; color:#38bdf8; margin-top:2px;">Lv${lv}: HP ${fmt(st.hp[lv], hpVal)} / 攻 ${fmt(st.at[lv], atVal)} / 速 ${fmt(st.sp[lv], spVal)}</div>`)
        .join("");

      const RANKS = ["F", "E", "D", "C", "B", "A"];
      const spParts = [];
      const addSp = (label, arr, v) => {
        if (v >= 6 || !arr) return;
        const lv = arr[5 - v];
        if (lv !== 0) {
          spParts.push(`${label}Lv${lv}`);
          return;
        }
        const rIdx = 6 - v;
        let lo = rIdx, hi = rIdx;
        while (lo > 0 && arr[lo - 1] === 0) lo--;
        while (hi < 5 && arr[hi] === 0) hi++;
        if (lo === 0 && hi === 5) {
          spParts.push(`${label}全ランク同値`);
        } else {
          const same = [];
          for (let i = hi; i >= lo; i--) {
            if (i !== rIdx) same.push(RANKS[i]);
          }
          spParts.push(`${label}${same.join("・")}と同値`);
        }
      };
      addSp("HP", st.split.hp, hpVal);
      addSp("攻", st.split.at, atVal);
      addSp("速", st.split.sp, spVal);
      const spHtml = spParts.length > 0
        ? `<div style="font-size:10px; color:#fbbf24; margin-top:2px;">判別: ${spParts.join(" / ")}</div>`
        : "";
      return lvHtml + spHtml;
    }

    const openChapters = new Set();
    function togglePartyBox() {
      const body = document.getElementById("party-body");
      const title = document.getElementById("party-toggle-title");
      const isHidden = body.style.display === "none";
      body.style.display = isHidden ? "block" : "none";
      title.textContent = (isHidden ? "▼" : "▶") + " 自チーム入力（序章〜第6章の出現率を自動計算）";
    }
    function toggleChapter(chap) {
      if (openChapters.has(chap)) openChapters.delete(chap);
      else openChapters.add(chap);
      render();
    }

    function saveAll() {
      try {
        const res = db.exec("SELECT id, method, hp, at, sp, cmd, marked FROM monsters");
        const data = res.length > 0 ? res[0].values : [];
        localStorage.setItem("oreca2_sql_saved_v2", JSON.stringify(data));
      } catch (_) {}
    }

    function render() {
      const chap = document.getElementById("chapter").value;
      const methodFilter = document.getElementById("methodFilter").value;
      const bossFilter = document.getElementById("bossFilter").value;
      const keyword = document.getElementById("search").value.trim();
      
      const markedOnly = document.getElementById("markedOnly").checked;

      const conditions = [];
      const whereParams = [];

      if (chap !== "ALL") {
        conditions.push("chapter = ?");
        whereParams.push(chap);
      }
      if (methodFilter === "バトル") {
        conditions.push("can_battle = 1");
      } else if (methodFilter === "合体") {
        conditions.push("can_fusion = 1");
      } else if (methodFilter === "両方") {
        conditions.push("can_battle = 1 AND can_fusion = 1");
      }
      if (bossFilter === "通常") {
        conditions.push("is_boss = 0");
      } else if (bossFilter === "ボス") {
        conditions.push("is_boss = 1");
      }
      
      if (keyword !== "") {
        conditions.push("name LIKE ?");
        whereParams.push(`%${keyword}%`);
      }
      if (markedOnly) {
        conditions.push("marked = 1");
      }

      const whereSql = conditions.length > 0 ? "WHERE " + conditions.join(" AND ") : "";

      // ③ SQLで確率と期待金額を計算
      const pStat = "((hp / 6.0) * (at / 6.0) * (sp / 6.0) * (cmd / 6.0))";
      const battleProbExpr = `(
        CASE
          WHEN method = 'バトル' AND (p1_rate + p2_rate + p3_rate) > 0 THEN
            p1_rate * ${pStat}
            + p2_rate * (1.0 - (1.0 - ${pStat}) * (1.0 - ${pStat}))
            + p3_rate * (1.0 - (1.0 - ${pStat}) * (1.0 - ${pStat}) * (1.0 - ${pStat}))
          WHEN method = 'バトル' THEN
            ${pStat} * (encounter_pct / 100.0)
          ELSE 0.0
        END
      )`;
      const totalProbExpr = `(${battleProbExpr} + ${pStat} * fusion_rolls)`;
      const costExpr = `
        CASE
          WHEN ${totalProbExpr} <= 0 THEN NULL
          ELSE ROUND(100.0 / ${totalProbExpr})
        END
      `;

      const markedRes = db.exec(
        `SELECT COUNT(*), COALESCE(SUM(${costExpr}), 0) FROM monsters WHERE marked = 1`
      );
      const [selectedCount, selectedTotal] = markedRes[0].values[0];
      const summaryText = selectedCount > 0
        ? `★選んだモンスターの合計期待金額：${Number(selectedTotal).toLocaleString()}円（${selectedCount}体）`
        : `★選んだモンスターの合計期待金額：0円（0体） ※☆を押すと合計に入ります`;

      const sql = `
        SELECT
          id, name, chapter, method, can_battle, can_fusion, hp, at, sp, cmd, marked, encounter_pct, p1_rate, p2_rate, p3_rate, is_boss, fusion_rolls,
          ROUND((hp / 6.0) * (at / 6.0) * (sp / 6.0) * (cmd / 6.0) * 100, 4) AS pct,
          ${costExpr} AS cost
        FROM monsters
        ${whereSql}
        ORDER BY id ASC;
      `;

      const res = db.exec(sql, whereParams);
      if (res.length === 0) {
        document.getElementById("summary").textContent = summaryText;
        document.getElementById("output").innerHTML = "該当なし";
        return;
      }

      const makeSelect = (id, label, col, current, isCmd = false) => {

          : [[1, "A"], [2, "B+"], [3, "C+"], [4, "D+"], [5, "E+"], [6, "不問"]];
        return `
          <label style="display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: #94a3b8;">
            <span>${label}</span>
            <select onchange="updateStat(${id}, '${col}', this.value)" style="padding: 2px 4px; font-size: 12px;">
              ${opts.map(([v, text]) => `<option value="${v}" ${v === current ? "selected" : ""}>${text}</option>`).join("")}
            </select>
          </label>
        `;
      };

      const groups = new Map();
      res[0].values.forEach(row => {
        const c = row[2];
        if (!groups.has(c)) groups.set(c, []);
        groups.get(c).push(row);
      });

      const autoOpen = (chap !== "ALL" || keyword !== "" || markedOnly || methodFilter !== "ALL" || bossFilter !== "ALL");
      let total = 0;
      const count = res[0].values.length;
      let html = "";

      const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);

      groups.forEach((rows, groupChap) => {
        let chapMarkedCount = 0;
        let chapMarkedTotal = 0;
        let rowsHtml = "";

       rows.forEach(([id, name, c, method, canBattle, canFusion, hp, at, sp, cmd, marked, encPct, p1Rate, p2Rate, p3Rate, isBoss, fusionRolls, pct, cost]) => {
          const num = hp * at * sp * cmd;
          const den = 1296;
          const g = gcd(num, den);
          const frac = `${num / g}/${den / g}`;
          const badgeColor = method === "合体" ? "#34d399" : "#60a5fa";
          const star = marked ? "★" : "☆";
          const starColor = marked ? "#fbbf24" : "#64748b";
          const costNum = cost != null ? Number(cost) : null;
          const fusionLabel = fusionRolls > 0 ? `${Number(fusionRolls.toFixed(2))}回` : "0回";
          const costLabel = costNum != null ? `${costNum.toLocaleString()}円` : "合体不可";
          if (marked && costNum != null) {
            chapMarkedCount++;
            chapMarkedTotal += costNum;
          }

          const methodHtml = (canBattle && canFusion)
            ? `<select onchange="updateMethod(${id}, this.value)" style="padding: 1px 4px; font-size: 11px; margin: 0;">
                 <option value="バトル" ${method === "バトル" ? "selected" : ""}>バトル</option>
                 <option value="合体" ${method === "合体" ? "selected" : ""}>合体</option>
               </select> <small style="color:#fbbf24;">(両方可)</small>`
            : `<span style="color: ${badgeColor};">${method}</span>`;

          rowsHtml += `
            <tr>
              <td>
                <button class="star-btn" style="color: ${starColor};" onclick="toggleMark(${id}, ${marked})">${star}</button>${name}${isBoss ? ' <small style="background:#dc2626;color:#fff;padding:1px 4px;border-radius:4px;font-size:10px;">BOSS</small>' : ''}<br>
                <small style="color: #94a3b8;">
                  ${c} / ${methodHtml}
                </small>
              </td>
              <td>
                <div style="display: grid; grid-template-columns: repeat(2, max-content); gap: 4px 8px;">
                  ${makeSelect(id, "HP", "hp", hp)}
                  ${makeSelect(id, "攻", "at", at)}
                  ${makeSelect(id, "速", "sp", sp)}
                  ${makeSelect(id, "コ", "cmd", cmd, true)}
                </div>
              </td>
              <td style="text-align: right; white-space: nowrap;">${fusionLabel}</td>
              <td>
                ${frac}<br>
                <small style="color: #94a3b8;">${pct}%</small>
              </td>
              <td>
                ${costLabel}
                ${method === "バトル" ? `<br><small style="color:#94a3b8;">出現率 ${encPct}%${
                  (p2Rate + p3Rate) > 0
                    ? `<br>(1体:${Math.round(p1Rate * 100)}% / 複数:${Math.round((p2Rate + p3Rate) * 100)}%)`
                    : ""
                }</small>` : ""}
              </td>
            </tr>
          `;
        });

        const isOpen = autoOpen || openChapters.has(groupChap);
        html += `
          <div style="margin-top: 10px; border: 1px solid #334155; border-radius: 8px; overflow: hidden; background: #1e293b;">
            <button type="button" onclick="toggleChapter('${groupChap}')" style="width: 100%; display: flex; justify-content: space-between; align-items: center; background: #334155; color: #f8fafc; border: none; padding: 10px 12px; margin: 0; border-radius: 0; font-size: 15px; font-weight: bold; cursor: pointer; text-align: left;">
              <span>${isOpen ? "▼" : "▶"} ${groupChap}</span>
              <span style="font-size: 13px; color: #fbbf24;">${rows.length}体${chapMarkedCount > 0 ? ` / ★${chapMarkedCount}体: ${chapMarkedTotal.toLocaleString()}円` : ""}</span>
            </button>
            ${isOpen ? `
              <div style="overflow-x: auto;">
                <table style="margin-top: 0;">
                  <tr>
                    <th>モンスター</th>
                  <th>条件</th>
                  <th>合体回数</th>
                    <th>確率</th>
                    <th>期待金額</th>
                  </tr>
                  ${rowsHtml}
                </table>
              </div>
            ` : ""}
          </div>
        `;
      });

      document.getElementById("summary").textContent = summaryText;
      document.getElementById("output").innerHTML = html;
    }

    function updateStat(id, col, val) {
      const allowed = ["hp", "at", "sp", "cmd"];
      if (!allowed.includes(col)) return;
      db.run(`UPDATE monsters SET ${col} = ? WHERE id = ?`, [Number(val), Number(id)]);
      saveAll();
      render();
    }
    function updateMethod(id, method) {
      if (method !== "バトル" && method !== "合体") return;
      db.run("UPDATE monsters SET method = ? WHERE id = ?", [method, Number(id)]);
      saveAll();
      render();
    }

    function toggleMark(id, current) {
      const next = current ? 0 : 1;
      db.run("UPDATE monsters SET marked = ? WHERE id = ?", [next, Number(id)]);
      saveAll();
      render();
    }

    document.getElementById("chapter").addEventListener("change", render);
    document.getElementById("search").addEventListener("input", render);
    document.getElementById("methodFilter").addEventListener("change", render);
    document.getElementById("bossFilter").addEventListener("change", render);
    document.getElementById("fusionRolls").addEventListener("input", render);
    document.getElementById("markedOnly").addEventListener("change", render);
    function comb(n, r) {
      if (r < 0 || r > n) return 0;
      let res = 1;
      for (let i = 1; i <= r; i++) res = res * (n - i + 1) / i;
      return res;
    }

    // アイテム合体の全パターン（元の2つが消え、新アイテムが1つ増える）を展開
// 合体の館で起こりうる「手持ちモンスター＋所持アイテム」の全状態を連鎖展開
    function getFusionStates(partySlots) {
      const initSlots = partySlots
        .map((s, i) => ({ name: s.name, lv: s.lv, origin: `p${i}` }))
        .filter(s => s.name);
      const initItems = partySlots
        .map((s, i) => (s.item ? { name: s.item, origin: `i${i}` } : null))
        .filter(Boolean);

      const states = [{ slots: initSlots, items: initItems }];
      const stateKey = (st) =>
        st.slots.map(s => `${s.name}@${s.lv >= 9 ? 10 : 1}:${s.origin}`).sort().join(",") +
        "||" +
        st.items.map(it => `${it.name}:${it.origin}`).sort().join(",");

      const seen = new Set([stateKey(states[0])]);
      const queue = [states[0]];

      while (queue.length > 0 && states.length < 200) {
        const cur = queue.shift();

        // 1. アイテム同士の合体（元の2つが消えて、新アイテムが1つ増える）
        for (let i = 0; i < cur.items.length; i++) {
          for (let j = i + 1; j < cur.items.length; j++) {
            for (const f of ITEM_FUSIONS) {
              const it1 = cur.items[i], it2 = cur.items[j];
              if ((it1.name === f.a && it2.name === f.b) || (it1.name === f.b && it2.name === f.a)) {
                const nextItems = cur.items.filter((_, idx) => idx !== i && idx !== j);
                const itemOrg = `if(${[it1.origin, it2.origin].sort().join("+")})`;
                nextItems.push({ name: f.result, origin: itemOrg });
                const next = { slots: cur.slots, items: nextItems };
                const k = stateKey(next);
                if (!seen.has(k)) { seen.add(k); states.push(next); queue.push(next); }
              }
            }
          }
        }

        // 2. 手持ちモンスターの合体・進化（新しいLv1モンスターになり、素材と使用アイテムが消える）
        for (const [targetName, recipes] of Object.entries(FUSION_RECIPES)) {
          for (const r of recipes) {
            const reqItem = r.item || null;
            const matchedItems = reqItem
              ? cur.items.map((it, idx) => ({ it, idx })).filter(x => x.it.name === reqItem)
              : [{ it: null, idx: -1 }];

            for (const { it: usedItem, idx: itemIdx } of matchedItems) {
              const consumeItem = (items) => usedItem ? items.filter((_, idx) => idx !== itemIdx) : items;
              const itemTag = usedItem ? `+${usedItem.origin}` : "";

              if (!r.b) {
                cur.slots.forEach((s, idx) => {
                  if (s.name === r.a && (!r.lv10A || s.lv >= 9)) {
                    const nextSlots = cur.slots.filter((_, k) => k !== idx);
                    nextSlots.push({
                      name: targetName,
                      lv: 1,
                      origin: `f(${s.origin}${itemTag})`
                    });
                    const next = { slots: nextSlots, items: consumeItem(cur.items) };
                    const k = stateKey(next);
                    if (!seen.has(k)) { seen.add(k); states.push(next); queue.push(next); }
                  }
                });
              } else {
                for (let i = 0; i < cur.slots.length; i++) {
                  for (let j = i + 1; j < cur.slots.length; j++) {
                    const s1 = cur.slots[i], s2 = cur.slots[j];
                    const m1 = s1.name === r.a && (!r.lv10A || s1.lv >= 9) && s2.name === r.b && (!r.lv10B || s2.lv >= 9);
                    const m2 = s1.name === r.b && (!r.lv10B || s1.lv >= 9) && s2.name === r.a && (!r.lv10A || s2.lv >= 9);
                    if (m1 || m2) {
                      const nextSlots = cur.slots.filter((_, k) => k !== i && k !== j);
                      const pairOrg = [s1.origin, s2.origin].sort().join("+");
                      nextSlots.push({
                        name: targetName,
                        lv: 1,
                        origin: `f(${pairOrg}${itemTag})`
                      });
                      const next = { slots: nextSlots, items: consumeItem(cur.items) };
                      const k = stateKey(next);
                      if (!seen.has(k)) { seen.add(k); states.push(next); queue.push(next); }
                    }
                  }
                }
              }
            }
          }
        }
      }
      return states;
    }
    // スライム系（レベルアップ素材として使うと消費され、相手がLvUPして抽選リセット）
    const SLIME_LV_UP = {
      "スライム": 1,
      "スライム・ドラゴン": 2,
      "スライム・シルバー": 2,
      "スライム・ゴールド": 3,
      "スライム・マナ": 4,
      "スライム・アビス": 2,
      "スライム・フレア": 2,
      "スライム・アース": 2,
      "スライム・エアロ": 2,
      "スライム・デビル": 2,
      "スライム・エンジェル": 2,
      "スライム・トリフ": 1
    };

    // モンスターごとの「1プレイあたりの最大期待合体回数（リセット連鎖込み）」を計算
    function calcOptimalFusionRolls(monsterName, isBoss, partySlots, enemyRatesMap, bossNameSet) {
      const recipes = FUSION_RECIPES[monsterName] || [];
      const changeItems = ILLUST_CHANGE_ITEMS[monsterName] || [];
      if (recipes.length === 0 && changeItems.length === 0) return 0;

      const initSlots = partySlots
        .map(s => ({ name: s.name, lv: Math.min(10, s.lv + 1), changed: false }))
        .filter(s => s.name);
      const initItems = partySlots.map(s => s.item).filter(Boolean).sort();

      // このモンスターのレシピに「バトルで仲間になる敵」が含まれるか調べる
      const relevantEnemies = new Set();
      for (const r of recipes) {
        if (r.b) {
          if (!r.lv10B && enemyRatesMap[r.b]) relevantEnemies.add(r.b);
          if (!r.lv10A && enemyRatesMap[r.a]) relevantEnemies.add(r.a);
        }
      }

      const solveWithEnemies = (initEnemies) => {
        const memo = new Map();
        let steps = 0;

        const makeKey = (slots, items, enemies) => {
          const sKey = slots.map(s => `${s.name}@${s.lv}${s.changed ? "c" : ""}`).sort().join(",");
          const iKey = items.join(",");
          const eKey = Object.entries(enemies).filter(([, c]) => c > 0).sort().map(([n, c]) => `${n}:${c}`).join(",");
          return `${sKey}|${iKey}|${eKey}`;
        };

        // 現在の状態(リセットなし)で targetName の抽選を何通り確認できるか
        const countPeeks = (slots, items, enemies) => {
          let total = 0;
          // 1. イラストチェンジ
          if (changeItems.length > 0) {
            for (const s of slots) {
              if (s.name === monsterName && !s.changed && (isBoss || s.lv >= 10)) {
                for (const it of items) {
                  if (changeItems.includes(it)) total += 1;
                }
              }
            }
          }
          // 2. 合体・進化レシピ
          for (const r of recipes) {
            const reqItem = r.item || null;
            const itemMult = reqItem ? items.filter(it => it === reqItem).length : 1;
            if (itemMult === 0) continue;

            if (!r.b) {
              for (const s of slots) {
                if (s.name === r.a && (!r.lv10A || s.lv >= 10)) total += itemMult;
              }
            } else {
              // 手持ち同士
              for (let i = 0; i < slots.length; i++) {
                for (let j = i + 1; j < slots.length; j++) {
                  const s1 = slots[i], s2 = slots[j];
                  const m1 = s1.name === r.a && (!r.lv10A || s1.lv >= 10) && s2.name === r.b && (!r.lv10B || s2.lv >= 10);
                  const m2 = s1.name === r.b && (!r.lv10B || s1.lv >= 10) && s2.name === r.a && (!r.lv10A || s2.lv >= 10);
                  if (m1 || m2) total += itemMult;
                }
              }
              // 手持ち1体 ＋ 敵モンスター（出現した個体数ぶん別抽選！）
              for (const s of slots) {
                if (s.name === r.a && (!r.lv10A || s.lv >= 10) && !r.lv10B && (enemies[r.b] || 0) > 0) {
                  total += enemies[r.b] * itemMult;
                }
                if (s.name === r.b && (!r.lv10B || s.lv >= 10) && !r.lv10A && (enemies[r.a] || 0) > 0) {
                  total += enemies[r.a] * itemMult;
                }
              }
            }
          }
          return total;
        };

        const dfs = (slots, items, enemies) => {
          const key = makeKey(slots, items, enemies);
          if (memo.has(key)) return memo.get(key);
          const curPeeks = countPeeks(slots, items, enemies);
          if (++steps > 350) return curPeeks;

          let bestNext = 0;
          const tryNext = (nSlots, nItems, nEnemies) => {
            const val = dfs(nSlots, nItems, nEnemies);
            if (val > bestNext) bestNext = val;
          };

          // 遷移A: アイテム同士の合体
          for (let i = 0; i < items.length; i++) {
            for (let j = i + 1; j < items.length; j++) {
              if (i > 0 && items[i] === items[i - 1]) continue;
              for (const f of ITEM_FUSIONS) {
                if ((items[i] === f.a && items[j] === f.b) || (items[i] === f.b && items[j] === f.a)) {
                  const nItems = items.filter((_, idx) => idx !== i && idx !== j);
                  nItems.push(f.result);
                  nItems.sort();
                  tryNext(slots, nItems, enemies);
                }
              }
            }
          }

          // 遷移B: イラストチェンジ（BOSS または Lv9以上 ＋ 専用アイテム）
          for (let i = 0; i < slots.length; i++) {
            const s = slots[i];
            if (s.changed || !(bossNameSet.has(s.name) || s.lv >= 10)) continue;
            const cItems = ILLUST_CHANGE_ITEMS[s.name];
            if (!cItems) continue;
            for (const req of cItems) {
              const idx = items.indexOf(req);
              if (idx !== -1) {
                const nSlots = slots.map((x, k) => k === i ? { ...x, changed: true } : x);
                const nItems = items.filter((_, k) => k !== idx);
                tryNext(nSlots, nItems, enemies);
              }
            }
          }

          // 遷移C: モンスター進化・合体（実行して素材消費 → 全抽選リセット）

        const s = [1, 2, 3].reduce((acc, k) => acc + (Number(document.getElementById(`p${k}-star`).value) || 0), 0);
        const l = [1, 2, 3].reduce((acc, k) => acc + (Number(document.getElementById(`p${k}-lv`).value) || 0), 0);
        const b = s <= 6 ? "3-6" : s <= 9 ? "7-9" : "10-12";
        document.getElementById("party-info").textContent = `クラス合計: ${s} (${b}) / 合計Lv: ${l}`;
      };
      nameInput.addEventListener("input", updateSummary);
      starInput.addEventListener("input", updateSummary);
      lvInput.addEventListener("input", updateSummary);
    });
    init();
  </script>
</body>
</html>
