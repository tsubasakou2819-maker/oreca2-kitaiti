      if (openChapters.has(chap)) openChapters.delete(chap);

      render();

    function saveAll() {

      } catch (_) {}

    function render() {
      const chap = document.getElementById("chapter").value;
      const methodFilter = document.getElementById("methodFilter").value;
      const bossFilter = document.getElementById("bossFilter").value;
      const keyword = document.getElementById("search").value.trim();
      const fusionRolls = Math.max(1, Number(document.getElementById("fusionRolls").value) || 1);
      const markedOnly = document.getElementById("markedOnly").checked;

      const conditions = [];
      const whereParams = [];

      if (chap !== "ALL") {
        conditions.push("chapter = ?");
        whereParams.push(chap);
      }
      if (methodFilter === "バトル") {
        conditions.push("can_battle = 1");
      } else if (methodFilter === "合体") {
        conditions.push("can_fusion = 1");
      } else if (methodFilter === "両方") {
        conditions.push("can_battle = 1 AND can_fusion = 1");
      }
      if (bossFilter === "通常") {
        conditions.push("is_boss = 0");
      } else if (bossFilter === "ボス") {
        conditions.push("is_boss = 1");
      }
      
      if (keyword !== "") {
        conditions.push("name LIKE ?");
        whereParams.push(`%${keyword}%`);
      }
      if (markedOnly) {
        conditions.push("marked = 1");
      }

      const whereSql = conditions.length > 0 ? "WHERE " + conditions.join(" AND ") : "";

      // ③ SQLで確率と期待金額を計算
      const costExpr = `
        ROUND(
          1.0 / (
            CASE
              WHEN method = 'バトル' AND (p1_rate + p2_rate + p3_rate) > 0 THEN
                p1_rate * ((hp / 6.0) * (at / 6.0) * (sp / 6.0) * (cmd / 6.0))
                + p2_rate * (1.0 - (1.0 - (hp / 6.0) * (at / 6.0) * (sp / 6.0) * (cmd / 6.0)) * (1.0 - (hp / 6.0) * (at / 6.0) * (sp / 6.0) * (cmd / 6.0)))
                + p3_rate * (1.0 - (1.0 - (hp / 6.0) * (at / 6.0) * (sp / 6.0) * (cmd / 6.0)) * (1.0 - (hp / 6.0) * (at / 6.0) * (sp / 6.0) * (cmd / 6.0)) * (1.0 - (hp / 6.0) * (at / 6.0) * (sp / 6.0) * (cmd / 6.0)))
              WHEN method = 'バトル' THEN
                ((hp / 6.0) * (at / 6.0) * (sp / 6.0) * (cmd / 6.0)) * (encounter_pct / 100.0)
              ELSE
                ((hp / 6.0) * (at / 6.0) * (sp / 6.0) * (cmd / 6.0))
            END
          )
          / CASE WHEN method = '合体' THEN ? ELSE 1 END
          * 100 + 100
        )
      `;

      const markedRes = db.exec(
        `SELECT COUNT(*), COALESCE(SUM(${costExpr}), 0) FROM monsters WHERE marked = 1`,
        [fusionRolls]
      );
      const [selectedCount, selectedTotal] = markedRes[0].values[0];
      const summaryText = selectedCount > 0
        ? `★選んだモンスターの合計期待金額：${Number(selectedTotal).toLocaleString()}円（${selectedCount}体）`
        : `★選んだモンスターの合計期待金額：0円（0体） ※☆を押すと合計に入ります`;

      const sql = `
        SELECT
          id, name, chapter, method, can_battle, can_fusion, hp, at, sp, cmd, marked, encounter_pct, p1_rate, p2_rate, p3_rate,is_boss,
          ROUND((hp / 6.0) * (at / 6.0) * (sp / 6.0) * (cmd / 6.0) * 100, 4) AS pct,
          ${costExpr} AS cost
        FROM monsters
        ${whereSql}
        ORDER BY id ASC;
      `;

      const res = db.exec(sql, [fusionRolls, ...whereParams]);
      if (res.length === 0) {
        document.getElementById("summary").textContent = summaryText;
        document.getElementById("output").innerHTML = "該当なし";
        return;
      }

      const makeSelect = (id, label, col, current, isCmd = false) => {
        const opts = isCmd
          ? [[1, "コマ潜"], [6, "不問"]]
          : [[1, "A"], [2, "B+"], [3, "C+"], [4, "D+"], [5, "E+"], [6, "不問"]];
        return `
          <label style="display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: #94a3b8;">
            <span>${label}</span>
            <select onchange="updateStat(${id}, '${col}', this.value)" style="padding: 2px 4px; font-size: 12px;">
              ${opts.map(([v, text]) => `<option value="${v}" ${v === current ? "selected" : ""}>${text}</option>`).join("")}
            </select>
          </label>
        `;
      };

      const groups = new Map();
      res[0].values.forEach(row => {
        const c = row[2];
        if (!groups.has(c)) groups.set(c, []);
        groups.get(c).push(row);
      });

      const autoOpen = (chap !== "ALL" || keyword !== "" || markedOnly || methodFilter !== "ALL" || bossFilter !== "ALL");
      let total = 0;
      const count = res[0].values.length;
      let html = "";

      const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);

      groups.forEach((rows, groupChap) => {
        let chapMarkedCount = 0;
        let chapMarkedTotal = 0;
        let rowsHtml = "";

       rows.forEach(([id, name, c, method, canBattle, canFusion, hp, at, sp, cmd, marked, encPct, p1Rate, p2Rate, p3Rate, isBoss, pct, cost]) => {
          const num = hp * at * sp * cmd;
          const den = 1296;
          const g = gcd(num, den);
          const frac = `${num / g}/${den / g}`;
          const badgeColor = method === "合体" ? "#34d399" : "#60a5fa";
          const star = marked ? "★" : "☆";
          const starColor = marked ? "#fbbf24" : "#64748b";
          const costNum = Number(cost);
          if (marked) {
            chapMarkedCount++;
            chapMarkedTotal += costNum;
          }

          const methodHtml = (canBattle && canFusion)
            ? `<select onchange="updateMethod(${id}, this.value)" style="padding: 1px 4px; font-size: 11px; margin: 0;">
                 <option value="バトル" ${method === "バトル" ? "selected" : ""}>バトル</option>
                 <option value="合体" ${method === "合体" ? "selected" : ""}>合体</option>
               </select> <small style="color:#fbbf24;">(両方可)</small>`
            : `<span style="color: ${badgeColor};">${method}</span>`;

          rowsHtml += `
            <tr>
              <td>
                <button class="star-btn" style="color: ${starColor};" onclick="toggleMark(${id}, ${marked})">${star}</button>${name}${isBoss ? ' <small style="background:#dc2626;color:#fff;padding:1px 4px;border-radius:4px;font-size:10px;">BOSS</small>' : ''}<br>
                <small style="color: #94a3b8;">
                  ${c} / ${methodHtml}
                </small>
              </td>
              <td>
                <div style="display: grid; grid-template-columns: repeat(2, max-content); gap: 4px 8px;">
                  ${makeSelect(id, "HP", "hp", hp)}
                  ${makeSelect(id, "攻", "at", at)}
                  ${makeSelect(id, "速", "sp", sp)}
                  ${makeSelect(id, "コ", "cmd", cmd, true)}
                </div>
              </td>
              <td>
                ${frac}<br>
                <small style="color: #94a3b8;">${pct}%</small>
              </td>
              <td>
                ${costNum.toLocaleString()}円
                ${method === "バトル" ? `<br><small style="color:#94a3b8;">出現率 ${encPct}%${
                (p2Rate + p3Rate) > 0
                  ? `<br>(1体:${Math.round(p1Rate * 100)}% / 複数:${Math.round((p2Rate + p3Rate) * 100)}%)`
                  : ""
              }</small>` : ""}
              </td>
            </tr>
          `;
        });

        const isOpen = autoOpen || openChapters.has(groupChap);
        html += `
          <div style="margin-top: 10px; border: 1px solid #334155; border-radius: 8px; overflow: hidden; background: #1e293b;">
            <button type="button" onclick="toggleChapter('${groupChap}')" style="width: 100%; display: flex; justify-content: space-between; align-items: center; background: #334155; color: #f8fafc; border: none; padding: 10px 12px; margin: 0; border-radius: 0; font-size: 15px; font-weight: bold; cursor: pointer; text-align: left;">
              <span>${isOpen ? "▼" : "▶"} ${groupChap}</span>
              <span style="font-size: 13px; color: #fbbf24;">${rows.length}体${chapMarkedCount > 0 ? ` / ★${chapMarkedCount}体: ${chapMarkedTotal.toLocaleString()}円` : ""}</span>
            </button>
            ${isOpen ? `
              <div style="overflow-x: auto;">
                <table style="margin-top: 0;">
                  <tr>
                    <th>モンスター名</th>
                    <th>条件</th>
                    <th>確率</th>
                    <th>期待金額</th>
                  </tr>
                  ${rowsHtml}
                </table>
              </div>
            ` : ""}
          </div>
        `;
      });

      document.getElementById("summary").textContent = summaryText;
      document.getElementById("output").innerHTML = html;
    }

    function updateStat(id, col, val) {
      const allowed = ["hp", "at", "sp", "cmd"];
      if (!allowed.includes(col)) return;
      db.run(`UPDATE monsters SET ${col} = ? WHERE id = ?`, [Number(val), Number(id)]);
      saveAll();
      render();
    }
    function updateMethod(id, method) {
      if (method !== "バトル" && method !== "合体") return;
      db.run("UPDATE monsters SET method = ? WHERE id = ?", [method, Number(id)]);
      saveAll();
      render();
    }

    function toggleMark(id, current) {
      const next = current ? 0 : 1;
      db.run("UPDATE monsters SET marked = ? WHERE id = ?", [next, Number(id)]);
      saveAll();
      render();
    }

    document.getElementById("chapter").addEventListener("change", render);
    document.getElementById("search").addEventListener("input", render);
    document.getElementById("methodFilter").addEventListener("change", render);
    document.getElementById("bossFilter").addEventListener("change", render);
    document.getElementById("fusionRolls").addEventListener("input", render);
    document.getElementById("markedOnly").addEventListener("change", render);
    function comb(n, r) {
      if (r < 0 || r > n) return 0;
      let res = 1;
      for (let i = 1; i <= r; i++) res = res * (n - i + 1) / i;
      return res;
    }

    function applyParty() {
      const names = [1, 2, 3].map(i => document.getElementById(`p${i}-name`).value.trim());
      const stars = [1, 2, 3].map(i => Number(document.getElementById(`p${i}-star`).value) || 0);
      const lvs = [1, 2, 3].map(i => Number(document.getElementById(`p${i}-lv`).value) || 0);

      const usedNames = names.filter(n => n !== "");
      const emptySlots = 3 - usedNames.length;
      const assistByChapter = {
        "序章": ["戦士スタン", "魔法使いマナナ", "ボット02"],
        "第1章": ["波戦士トリト", "拳士シャッパ", "ジャリゲータ"],
        "第2章": ["旅人アラン"],
        "第3章": ["風のナギ"],
        "第4章": ["悪魔マクス"],
        "第5章": ["歌士ヴェッチ"],
        "第6章": ["墓守エルメ"]
      };
      const pickProb = (total, count) => {
        if (count <= 0 || total <= 0) return 0;
        if (total - count < 3) return 1;
        return 1 - comb(total - count, 3) / comb(total, 3);
      };

      const targetChapters = ['序章', '第1章', '第2章', '第3章', '第4章', '第5章', '第6章'];
      const assistSummary = [];

      targetChapters.forEach(chap => {
        const assistPool = (assistByChapter[chap] || []).filter(n => !usedNames.includes(n));
        const assistMonsters = assistPool.slice(0, emptySlots);
        if (assistMonsters.length > 0) {
          assistSummary.push(`${chap}: ${assistMonsters.join("・")}`);
        }

        const chapStars = [0, 1, 2].map(i => names[i] ? stars[i] : 0);
        const chapLvs = [0, 1, 2].map(i => names[i] ? lvs[i] : 0);
        let aIdx = 0;
        for (let i = 0; i < 3; i++) {
          if (!names[i] && aIdx < assistMonsters.length) {
            const am = assistMonsters[aIdx++];
            chapStars[i] = (window.ALL_MONSTER_STARS && window.ALL_MONSTER_STARS[am]) || 1;
            chapLvs[i] = 1;
          }
        }

        const chapTotalStar = chapStars.reduce((a, b) => a + b, 0);
        const chapTotalLv = chapLvs.reduce((a, b) => a + b, 0);
        const allLv10 = (usedNames.length === 3 && lvs.every(lv => lv === 10));

        const mainBracket = chapTotalStar <= 6 ? "3-6" : chapTotalStar <= 9 ? "7-9" : "10-12";
        const brackets = [mainBracket];
        if (chapTotalLv <= 10 && mainBracket === "7-9") brackets.push("3-6");
        if (chapTotalLv <= 10 && mainBracket === "10-12") brackets.push("7-9");
        if (chapTotalLv >= 21 && mainBracket === "3-6") brackets.push("7-9");
        if (chapTotalLv >= 21 && mainBracket === "7-9") brackets.push("10-12");

        const ph = brackets.map(() => "?").join(",");
        const totalRes = db.exec(
          `SELECT COUNT(*) FROM enemy_teams WHERE chapter = ? AND bracket IN (${ph})`,
          [chap, ...brackets]
        );
        const T = totalRes[0].values[0][0];

        const mRes = db.exec("SELECT id, name FROM monsters WHERE chapter = ? AND can_battle = 1", [chap]);
        if (mRes.length === 0) return;
        
          const olemonForms = {
          "ゼノゴン": ["ゼノゴン", "ゼノドラン", "我竜ゼノドラゴン"],
          "アケロン": ["アケロン", "アーケロン", "守護竜アーケロン"],
          "イブリス": ["イブリス", "精霊イブリス", "導きの精霊イブリス"],
          "シナプ": ["シナプ", "シナプス", "信獣シナプス"],
          "エスティ": ["エスティ", "悪魔エスティ", "彩魔エストリエ"],
          "トゥルース": ["トゥルース", "鏡の精トゥルース", "真実の精トゥルース"],
          "死神見習いタナト": ["死神見習いタナト", "死神タナト", "不動の死神タナト"]
        };

        mRes[0].values.forEach(([id, name]) => {
          const targetNames = olemonForms[name] || [name];
          const namePh = targetNames.map(() => "?").join(",");
          const kRes = db.exec(
            `SELECT
               COALESCE(SUM(CASE WHEN cnt = 1 AND is_rare = 0 THEN 1 ELSE 0 END), 0),
               COALESCE(SUM(CASE WHEN cnt = 2 AND is_rare = 0 THEN 1 ELSE 0 END), 0),
               COALESCE(SUM(CASE WHEN cnt = 3 AND is_rare = 0 THEN 1 ELSE 0 END), 0),
               COALESCE(SUM(CASE WHEN cnt = 1 AND is_rare = 1 THEN 1 ELSE 0 END), 0),
               COALESCE(SUM(CASE WHEN cnt = 2 AND is_rare = 1 THEN 1 ELSE 0 END), 0),
               COALESCE(SUM(CASE WHEN cnt = 3 AND is_rare = 1 THEN 1 ELSE 0 END), 0)
             FROM (
               SELECT
                 (CASE WHEN m1 IN (${namePh}) THEN 1 ELSE 0 END) +
                 (CASE WHEN m2 IN (${namePh}) THEN 1 ELSE 0 END) +
                 (CASE WHEN m3 IN (${namePh}) THEN 1 ELSE 0 END) AS cnt,
                 CASE WHEN m2 IN ('ロック鳥ルフ', '不死鳥フェニックス') THEN 1 ELSE 0 END AS is_rare
               FROM enemy_teams
               WHERE chapter = ? AND bracket IN (${ph})
             )
             WHERE cnt > 0`,
            [...targetNames, ...targetNames, ...targetNames, chap, ...brackets]
          );
          const [k1, k2, k3, r1, r2, r3] = kRes[0].values[0];
          const K = k1 + k2 + k3;
          const R = r1 + r2 + r3;

          const calcProbs = (n1, n2, n3) => {
            const nAll = n1 + n2 + n3;
            const q3 = pickProb(T, n3);
            const q2or3 = pickProb(T, n2 + n3);
            const qAny = pickProb(T, nAll);
            return [Math.max(0, qAny - q2or3), Math.max(0, q2or3 - q3), q3, qAny];
          };

          let [p1, p2, p3, pAny] = calcProbs(k1, k2, k3);
          if (R > 0) {
            const rareWeight = 0.2;
            const [rp1, rp2, rp3, rpAny] = calcProbs(k1 + r1, k2 + r2, k3 + r3);
            p1 = p1 * (1 - rareWeight) + rp1 * rareWeight;
            p2 = p2 * (1 - rareWeight) + rp2 * rareWeight;
            p3 = p3 * (1 - rareWeight) + rp3 * rareWeight;
            pAny = pAny * (1 - rareWeight) + rpAny * rareWeight;
          }
          let pct = (K + R) === 0 ? 5 : Math.round(pAny * 100);
          if (K + R === 0) { p1 = 0.05; p2 = 0; p3 = 0; }
          // 序章 ボス・レア条件
          if (name === "魔王バスカー") {
            if (names[0] === "赤騎士スタン" || (names.includes("赤騎士スタン") && names.includes("魔導師マナナール") && names.includes("ボット03"))) { pct = 100; p1 = 1; p2 = 0; p3 = 0; }
            else if (mainBracket === "3-6") { const b = allLv10 ? 0.33 : 0.08; pct = Math.round(b * 100); p1 = b; p2 = 0; p3 = 0; }
          }
          if (name === "魔王ムウス" && K === 0) { pct = 25; p1 = 0.25; p2 = 0; p3 = 0; }
          if (name === "魔姫カーリィ" && mainBracket === "10-12") { const b = allLv10 ? 0.25 : 0.06; pct = Math.round(b * 100); p1 = b; p2 = 0; p3 = 0; }
          const mergeBoss = (bossB) => {
            if (bossB >= 1) {
              if (K + R === 0) { pct = 100; p1 = 1; p2 = 0; p3 = 0; }
              else { p3 = p2 + p3; p2 = p1; p1 = Math.max(0, 1 - pAny); pAny = 1; pct = 100; }
            } else if (bossB > 0) {
              const prevAny = (K + R === 0) ? 0 : pAny;
              if (K + R === 0) { p1 = 0; p2 = 0; p3 = 0; }
              pAny = 1 - (1 - prevAny) * (1 - bossB);
              p3 = p3 + p2 * bossB;
              p2 = p2 * (1 - bossB) + p1 * bossB;
              p1 = p1 * (1 - bossB) + (1 - prevAny) * bossB;
              pct = Math.round(pAny * 100);
            }
          };

          if (name === "ゼノゴン") {
            if (mainBracket === "3-6") mergeBoss(0.50);
            else if (mainBracket === "10-12") mergeBoss(allLv10 ? 0.25 : 0.06);
          }
          if (name === "アケロン") {
            if (names[0] === "波騎士トリト") mergeBoss(1);
            else if (mainBracket === "7-9") mergeBoss(allLv10 ? 0.33 : 0.08);
          }
          if (name === "イブリス") {
            if (["旅人アラン", "発見者アラン"].includes(names[0])) mergeBoss(1);
          }
          if (name === "シナプ") {
            if (names[0] === "風のナギ") mergeBoss(1);
            else mergeBoss(0.33);
          }
          if (name === "エスティ") {
            if (names[0] === "豪魔騎士マクス" || (names.includes("悪魔マクス") && names.includes("衛生兵ラプラ"))) mergeBoss(1);
            else if (mainBracket === "3-6") mergeBoss(allLv10 ? 0.50 : 0.13);
          }
          if (name === "トゥルース") {
            if (["ボーカリスト・ヴェッチ", "魔皇ミード", "アーティスト・ヴェッチ"].includes(names[0])) mergeBoss(1);
            else mergeBoss(0.20);
          }
          if (name === "死神見習いタナト") {
            if (["夜の騎士エルメ", "魔皇アウスレーゼ", "獄長牛頭馬頭"].includes(names[0])) mergeBoss(1);
            else mergeBoss(0.33);
          }
          // 第1章 ボス条件
          if (name === "魔王オロロソ") {
            if (["波騎士トリト", "ギョギョ", "乙姫マヨリ"].includes(names[0])) { pct = 100; p1 = 1; p2 = 0; p3 = 0; }
            else if (mainBracket === "10-12") { const b = allLv10 ? 0.25 : 0.06; pct = Math.round(b * 100); p1 = b; p2 = 0; p3 = 0; }
          }

          // 第2章 ボス条件
          if (name === "ひな鳥ルフ" && names.includes("旅人アラン") && names.includes("旅人シャール")) { pct = 100; p1 = 1; p2 = 0; p3 = 0; }
          if (name === "魔王アラキシュ") {
            if (names[0] === "鍛冶師アンヴィル" || (names.includes("発見者アラン") && (names.includes("放浪のシャルル") || names.includes("精霊イブリス")))) { pct = 100; p1 = 1; p2 = 0; p3 = 0; }
            else if (mainBracket === "10-12") { const b = allLv10 ? 0.25 : 0.06; pct = Math.round(b * 100); p1 = b; p2 = 0; p3 = 0; }
          }

          // 第3章 ボス条件
          if (name === "魔王ソジュ") {
            if (["疾風のナギ", "魔公子イスル"].includes(names[0])) { pct = 100; p1 = 1; p2 = 0; p3 = 0; }
            else if (mainBracket === "10-12") { const b = allLv10 ? 0.20 : 0.05; pct = Math.round(b * 100); p1 = b; p2 = 0; p3 = 0; }
          }
          if (name === "風隠の主ナナワライ") {
            if (["風隠の族長オロシ", "魔王ソジュ", "剣聖ヒエン"].includes(names[0])) { pct = 100; p1 = 1; p2 = 0; p3 = 0; }
            else { pct = 33; p1 = 0.33; p2 = 0; p3 = 0; }
          }

          // 第4章 ボス条件
          if (name === "魔王ベルゼブブ") {
            if (names[0] === "魔騎士マクス") { pct = 100; p1 = 1; p2 = 0; p3 = 0; }
            else if (mainBracket === "10-12") { const b = allLv10 ? 0.20 : 0.05; pct = Math.round(b * 100); p1 = b; p2 = 0; p3 = 0; }
          }
          if (name === "魔皇エラドーラ") {
            if (names[0] === "狂魔アルルカン" || (names.includes("魔騎士マクス") && names.includes("救命士ラプラ"))) { pct = 100; p1 = 1; p2 = 0; p3 = 0; }
            else if (mainBracket === "10-12") { const b = allLv10 ? 0.20 : 0.05; pct = Math.round(b * 100); p1 = b; p2 = 0; p3 = 0; }
          }

          // 第5章 ボス条件
          if (name === "魔皇ミード") {
            if (["鏡の精トゥルース", "ボーカリスト・ヴェッチ", "奈落の人魚セイレン"].includes(names[0])) { pct = 100; p1 = 1; p2 = 0; p3 = 0; }
            else if (mainBracket === "10-12") { const b = allLv10 ? 0.25 : 0.06; pct = Math.round(b * 100); p1 = b; p2 = 0; p3 = 0; }
          }

          // 第6章 ボス条件
          if (name === "獄卒ゴズ" || name === "獄卒メズ") {
            if (names.includes("夜の騎士エルメ") && names.includes("死神タナト")) { pct = 100; p1 = 1; p2 = 0; p3 = 0; }
            else if (mainBracket === "7-9") { const b = allLv10 ? 0.25 : 0.06; pct = Math.round(b * 100); p1 = b; p2 = 0; p3 = 0; }
          }
          if (name === "魔皇アウスレーゼ") {
            if (["死神タナト", "スカルボーンドラゴン"].includes(names[0]) || (names.includes("夜の騎士エルメ") && names.includes("成聖正騎士ユーグ") && names.includes("大司教クリフ"))) { pct = 100; p1 = 1; p2 = 0; p3 = 0; }
            else if (mainBracket === "10-12") { const b = allLv10 ? 0.20 : 0.05; pct = Math.round(b * 100); p1 = b; p2 = 0; p3 = 0; }
          }

          // お助け枠で味方に来る場合は1体確定＋敵出現分を上乗せ
          if (assistMonsters.includes(name)) {
            const enemy0 = (K + R) === 0 ? 1 : Math.max(0, 1 - pAny);
            const enemy1 = (K + R) === 0 ? 0 : p1;
            const enemy2plus = (K + R) === 0 ? 0 : (p2 + p3);
            p1 = enemy0;
            p2 = enemy1;
            p3 = enemy2plus;
            pct = 100;
          }

          db.run(
            "UPDATE monsters SET encounter_pct = ?, p1_rate = ?, p2_rate = ?, p3_rate = ? WHERE id = ?",
            [Math.max(1, pct), p1, p2, p3, id]
          );
        });
      });

      const baseStar = [0, 1, 2].reduce((acc, i) => acc + (names[i] ? stars[i] : 0), 0);
      const baseLv = [0, 1, 2].reduce((acc, i) => acc + (names[i] ? lvs[i] : 0), 0);
      const baseBracket = baseStar <= 6 ? "3-6" : baseStar <= 9 ? "7-9" : "10-12";
      const allLv10 = (usedNames.length === 3 && lvs.every(lv => lv === 10));

      document.getElementById("party-info").textContent =
        `クラス合計: ${baseStar} (${baseBracket}) / 合計Lv: ${baseLv}` +
        (allLv10 ? " 【全員Lv10：ボス確定枠あり】" : "") +
        (assistSummary.length > 0 ? ` / お助け: ${assistSummary.join(" / ")}` : "");
      render();
    }

      
    [1, 2, 3].forEach(i => {
      const nameInput = document.getElementById(`p${i}-name`);
      const starInput = document.getElementById(`p${i}-star`);
      const lvInput = document.getElementById(`p${i}-lv`);
      const updateSummary = () => {
        const name = nameInput.value.trim();
        if (window.ALL_MONSTER_STARS && window.ALL_MONSTER_STARS[name]) {
          starInput.value = window.ALL_MONSTER_STARS[name];
        }
        const s = [1, 2, 3].reduce((acc, k) => acc + (Number(document.getElementById(`p${k}-star`).value) || 0), 0);
        const l = [1, 2, 3].reduce((acc, k) => acc + (Number(document.getElementById(`p${k}-lv`).value) || 0), 0);
        const b = s <= 6 ? "3-6" : s <= 9 ? "7-9" : "10-12";
        document.getElementById("party-info").textContent = `クラス合計: ${s} (${b}) / 合計Lv: ${l}`;
      };
      nameInput.addEventListener("input", updateSummary);
      starInput.addEventListener("input", updateSummary);
      lvInput.addEventListener("input", updateSummary);
    });
    init();
  </script>
</body>
</html>
